name: Phase 6C 100000 real connection attempt
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connection-100k.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: wukong, repo: WuKongIM/WuKongIM, rev: 21d905a328bb7141167bc6dbe20fdb65588e0420}
          - {name: juggle, repo: juggleim/im-server, rev: 0a47433c1aed6f08b48a3bfcf6b80dfe0a55a6c4}
    steps:
      - name: Fetch pinned source and record limits
        env:
          REPO: ${{ matrix.repo }}
          REV: ${{ matrix.rev }}
        run: |
          set -euo pipefail
          mkdir -p reports
          git init -q upstream
          git -C upstream fetch -q --depth=1 "https://github.com/$REPO.git" "$REV"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$REV"
          printf '%s %s\n' "$REPO" "$REV" > reports/source.txt
          lscpu > reports/cpu.txt
          free -m > reports/memory.txt
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          { ulimit -Sn; ulimit -Hn; sysctl net.ipv4.ip_local_port_range fs.file-max; } > reports/limits.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Restrict published ports to loopback
        working-directory: upstream
        run: |
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('docker-compose.yml')
          s=re.sub(r'(?m)^(\s*-\s*")(?=(?:\d+|\$\{[A-Z_]+:-\d+\}):\d+")',r'\g<1>127.0.0.1:',p.read_text())
          p.write_text(s)
          PY
          docker compose --profile dev-sim config --format json | jq -e 'all(.services[].ports[]?; .host_ip == "127.0.0.1")'
      - name: WuKongIM actual protocol connection attempt
        if: matrix.name == 'wukong'
        working-directory: upstream
        env:
          WK_SIM_USERS: '100000'
          WK_SIM_PERSON_CHANNELS: '5'
          WK_SIM_GROUP_CHANNELS: '2'
          WK_SIM_GROUP_MEMBERS: '10'
          WK_SIM_RATE: '0.2/s'
          WK_SIM_VERIFY_RECV: sampled
        run: |
          set -euo pipefail
          sed -i 's/connect_rate: 10\/s/connect_rate: 500\/s/' docker/sim/dev-sim.yaml
          cat > ci-capacity.yml <<'YAML'
          services:
            wk-sim:
              sysctls:
                net.ipv4.ip_local_port_range: "1024 65535"
              ulimits:
                nofile:
                  soft: 524288
                  hard: 524288
            wk-node1:
              ulimits:
                nofile: 524288
            wk-node2:
              ulimits:
                nofile: 524288
            wk-node3:
              ulimits:
                nofile: 524288
          YAML
          docker compose -f docker-compose.yml -f ci-capacity.yml --profile dev-sim up -d --build wk-node1 wk-node2 wk-node3 wk-sim
          python3 - <<'PY'
          import urllib.request,json,time,pathlib,subprocess
          out=pathlib.Path('../reports')
          deadline=time.monotonic()+900
          peak=0; consecutive=0; baseline=None; passed=False
          while time.monotonic()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:19091/status',timeout=5) as r: s=json.load(r)
                  s['sample_unix']=time.time()
                  with (out/'status.jsonl').open('a') as f: f.write(json.dumps(s)+'\n')
                  active=int(s.get('active_users',0)); peak=max(peak,active)
                  print('active',active,'peak',peak,'state',s.get('state'),flush=True)
                  if s.get('state')=='running' and active>=100000:
                      if consecutive==0: baseline=s
                      consecutive+=1
                      if consecutive>=7 and s.get('messages_sent',0)>baseline.get('messages_sent',0) and s.get('send_errors',0)==baseline.get('send_errors',0) and s.get('recv_errors',0)==baseline.get('recv_errors',0):
                          passed=True; break
                  else: consecutive=0
              except Exception as e:
                  print('status unavailable:',str(e),flush=True); consecutive=0
              with (out/'resources.jsonl').open('a') as f:
                  try: subprocess.run(['docker','stats','--no-stream','--format','{{json .}}'],stdout=f,timeout=12,check=False)
                  except subprocess.TimeoutExpired: pass
              time.sleep(10)
          (out/'result.json').write_text(json.dumps({'target':100000,'peak_sampled_active':peak,'passed':passed,'criterion':'7 consecutive samples with 100000 active users and nonzero successful traffic, no additional send/receive errors; simulator sampled verification, token mode none'},indent=2))
          if not passed: raise SystemExit('100k target not demonstrated')
          PY
      - name: JuggleIM authenticated 100000-client attempt
        if: matrix.name == 'juggle'
        working-directory: upstream
        env:
          BENCH_CLIENTS: '100000'
          BENCH_RATE: '40'
          BENCH_WARMUP: '5s'
          BENCH_DURATION: '60s'
          BENCH_DELIVERY_GRACE: '10s'
          BENCH_OUTPUT_DIR: '../reports'
        run: |
          set -euo pipefail
          ulimit -n 262144 || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sql/imserver.sql')
          s=p.read_text()
          bad='+CREATE TABLE IF NOT EXISTS `inboxmsgs_split`'
          assert s.count(bad)==1
          p.write_text(s.replace(bad,bad[1:]))
          PY
          git diff -- docker-compose.yml sql/imserver.sql > ../reports/fixture.patch
          # A single source/destination TCP tuple pool is limited; this attempt
          # measures the shared-runner limit, not the server's capacity ceiling.
          (while true; do date -u; ss -s; free -m; docker stats --no-stream --format '{{json .}}' || true; sleep 15; done) > ../reports/resource-samples.txt 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=30s 25m bash scripts/run-benchmark.sh private 2>&1 | tee ../reports/benchmark.log
          jq -e '.connections.attempted==100000 and .connections.succeeded==100000 and .connections.failed==0 and .message_acknowledgements.succeeded>0 and .message_acknowledgements.failed==0 and .deliveries.succeeded>0 and .deliveries.failed==0' ../reports/*-private.json
      - name: Capture evidence and cleanup
        if: always()
        working-directory: upstream
        run: |
          mkdir -p ../reports
          docker ps -a > ../reports/container-status.txt || true
          if test -f ci-capacity.yml; then
            docker compose -f docker-compose.yml -f ci-capacity.yml --profile dev-sim logs --no-color --tail=100 > ../reports/service.log 2>&1 || true
            docker compose -f docker-compose.yml -f ci-capacity.yml --profile dev-sim down -v --remove-orphans || true
          else
            docker compose logs --no-color --tail=100 > ../reports/service.log 2>&1 || true
            docker compose down -v --remove-orphans || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connection-100k-${{ matrix.name }}
          path: reports/
          retention-days: 30
