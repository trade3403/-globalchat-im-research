name: Phase 8 JuggleIM isolated bridge diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/juggle-bridge-diagnosis.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:

          - {name: juggle, repo: juggleim/im-server, rev: 0a47433c1aed6f08b48a3bfcf6b80dfe0a55a6c4, clients: 12000}

    steps:
      - name: Fetch pinned source and record limits
        env:
          REPO: ${{ matrix.repo }}
          REV: ${{ matrix.rev }}
        run: |
          set -euo pipefail
          mkdir -p reports
          git init -q upstream
          git -C upstream fetch -q --depth=1 "https://github.com/$REPO.git" "$REV"
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$REV"
          printf '%s %s\n' "$REPO" "$REV" > reports/source.txt
          lscpu > reports/cpu.txt
          free -m > reports/memory.txt
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
          { ulimit -Sn; ulimit -Hn; sysctl net.ipv4.ip_local_port_range fs.file-max; } > reports/limits.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Restrict published ports to loopback
        working-directory: upstream
        run: |
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('docker-compose.yml')
          s=re.sub(r'(?m)^(\s*-\s*")(?=(?:\d+|\$\{[A-Z_]+:-\d+\}):\d+")',r'\g<1>127.0.0.1:',p.read_text())
          p.write_text(s)
          PY
          docker compose --profile dev-sim config --format json | jq -e 'all(.services[].ports[]?; .host_ip == "127.0.0.1")'
      - name: JuggleIM authenticated restart diagnosis
        if: matrix.name == 'juggle'
        working-directory: upstream
        env:
          BENCH_CLIENTS: '${{ matrix.clients }}'
          BENCH_RATE: '40'
          BENCH_WARMUP: '5s'
          BENCH_DURATION: '60s'
          BENCH_DELIVERY_GRACE: '10s'
          BENCH_OUTPUT_DIR: '../reports'
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --nofile=262144:262144
          ulimit -n | tee ../reports/client-nofile.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sql/imserver.sql')
          s=p.read_text()
          bad='+CREATE TABLE IF NOT EXISTS `inboxmsgs_split`'
          assert s.count(bad)==1
          p.write_text(s.replace(bad,bad[1:]))
          PY
          # Disable restart masking and propagate the real server exit status.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docker-compose.yml')
          s=p.read_text()
          s=s.replace('    container_name: juggleim-server\n    restart: unless-stopped','    container_name: juggleim-server\n    restart: "no"\n    ulimits:\n      nofile: 262144')
          # Require the final database server over TCP and the completed schema marker.
          lines=s.splitlines()
          matches=[i for i,line in enumerate(lines) if 'test: ["CMD", "mysqladmin"' in line]
          assert len(matches)==1
          import json
          health="MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uroot -N -B jim_db -e \"SELECT conf_value FROM globalconfs WHERE conf_key='jimdb_version'\" | grep -qx 20261103"
          lines[matches[0]]='      test: '+json.dumps(["CMD-SHELL",health])
          p.write_text('\n'.join(lines)+'\n')
          p=Path('launcher/scripts/run.sh')
          s=p.read_text().replace('set -e\n','set -e\nset -o pipefail\n',1)
          p.write_text(s)
          p=Path('scripts/run-benchmark.sh')
          s=p.read_text()
          old='docker compose up --detach --build'
          assert s.count(old)==1
          s=s.replace(old,old+'''
          direct_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' juggleim-server)"
          [[ "$direct_ip" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$ ]]
          ws_url="ws://${direct_ip}:9003"
          echo "Direct Docker bridge WebSocket route: ${ws_url}"
          ''')
          s=s.replace('--clients "${clients}"','--clients "${clients}" --connect-concurrency 8 --allow-non-loopback')
          assert '--connect-concurrency 8' in s and 'Direct Docker bridge' in s
          p.write_text(s)
          PY
          docker compose config --format json | jq -e '.services["im-server"].restart == "no" and .services.mysql.healthcheck.test[0] == "CMD-SHELL"'
          git diff -- docker-compose.yml sql/imserver.sql launcher/scripts/run.sh scripts/run-benchmark.sh > ../reports/fixture.patch
          docker events --filter type=container --format '{{json .}}' > ../reports/docker-events.jsonl &
          events=$!
          # A single source/destination TCP tuple pool is limited; this attempt
          # measures the shared-runner limit, not the server's capacity ceiling.
          (while true; do date -u; ss -s; free -m; docker stats --no-stream --format '{{json .}}' || true; sleep 10; done) > ../reports/resource-samples.txt 2>&1 &
          resource_monitor=$!
          # Sample the server network namespace and each process, not just container state.
          (while true; do
            date -u +%FT%T.%NZ
            pid=$(docker inspect -f '{{.State.Pid}}' juggleim-server 2>/dev/null || echo 0)
            if [[ "$pid" =~ ^[1-9][0-9]*$ ]] && sudo test -d "/proc/$pid"; then
              sudo nsenter -t "$pid" -n ss -lntp || true
              sudo nsenter -t "$pid" -n ss -Htan | awk '{n[$1]++} END {for (k in n) print k,n[k]}' || true
              docker top juggleim-server -eo pid,ppid,comm,rss,nlwp || true
              for p in $(docker top juggleim-server -eo pid 2>/dev/null | awk 'NR>1 && $1 ~ /^[0-9]+$/ {print $1}'); do
                echo "pid=$p fd=$(sudo ls /proc/$p/fd 2>/dev/null | wc -l)"
                sudo grep -E 'Max open files|Max processes' "/proc/$p/limits" || true
                cg=$(sudo awk -F: '$1=="0" {print $3}' "/proc/$p/cgroup" 2>/dev/null || true)
                if [[ -n "$cg" ]]; then
                  for f in memory.current memory.max memory.events pids.current pids.max pids.events; do
                    echo "$f"; sudo cat "/sys/fs/cgroup$cg/$f" 2>/dev/null || true
                  done
                fi
              done
            fi
            sleep 1
          done) > ../reports/listener-samples.txt 2>&1 &
          monitor=$!
          trap 'kill "$monitor" "$events" "$resource_monitor" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=30s 25m bash scripts/run-benchmark.sh private 2>&1 | tee ../reports/benchmark.log
          jq -e --argjson n "$BENCH_CLIENTS" '.connections.attempted==$n and .connections.succeeded==$n and .connections.failed==0 and .message_acknowledgements.succeeded>0 and .message_acknowledgements.failed==0 and .deliveries.succeeded>0 and .deliveries.failed==0' ../reports/*-private.json
      - name: Capture evidence and cleanup
        if: always()
        working-directory: upstream
        run: |
          mkdir -p ../reports
          docker ps -a > ../reports/container-status.txt || true
          if test -f ci-capacity.yml; then
            docker compose -f docker-compose.yml -f ci-capacity.yml --profile dev-sim ps -a
            if test -f ../reports/status.jsonl; then jq -r '[.state,.last_error] | @tsv' ../reports/status.jsonl | sort | uniq -c; fi
            docker compose -f docker-compose.yml -f ci-capacity.yml --profile dev-sim logs --no-color --tail=100 > ../reports/service.log 2>&1 || true
            docker compose -f docker-compose.yml -f ci-capacity.yml --profile dev-sim down -v --remove-orphans || true
          else
            docker inspect --format '{{.Name}} {{json .State}} restart={{.RestartCount}}' juggleim-server juggleim-mysql | tee ../reports/exit-state.txt || true
            sudo dmesg | grep -Ei 'oom|out of memory|killed process' | tail -n 50 | tee ../reports/kernel-oom.txt || true
            docker compose logs --no-color > ../reports/service.log 2>&1 || true
            if test -f ../reports/listener-samples.txt; then tail -n 180 ../reports/listener-samples.txt; fi
            if test -f ../reports/docker-events.jsonl; then tail -n 25 ../reports/docker-events.jsonl; fi
            grep -Ein 'panic:|fatal error:|runtime:|out of memory|too many open files|killed' ../reports/service.log | tail -n 40 | cut -c1-500 || true
            docker compose down -v --remove-orphans || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-preflight-${{ matrix.name }}-${{ matrix.clients }}
          path: reports/
          retention-days: 30
