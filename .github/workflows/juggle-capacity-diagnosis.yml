name: Phase 6C Juggle connection failure diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/juggle-capacity-diagnosis.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        clients: [10000, 20000]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: connection-100k-juggle
          run-id: 46025317632
          github-token: ${{ github.token }}
          path: previous
      - name: Summarize prior evidence
        run: |
          cat previous/limits.txt
          cat previous/container-status.txt
          tail -n 60 previous/resource-samples.txt
          grep -Ei 'panic|fatal|out of memory|too many open files|killed|error' previous/service.log | tail -n 30 | cut -c1-250 || true
      - name: Fetch fixed upstream revision
        run: |
          set -euo pipefail
          mkdir -p reports
          git init -q upstream
          git -C upstream fetch -q --depth=1 https://github.com/juggleim/im-server.git 0a47433c1aed6f08b48a3bfcf6b80dfe0a55a6c4
          git -C upstream checkout -q --detach FETCH_HEAD
          git -C upstream rev-parse HEAD > reports/source.txt
          lscpu > reports/cpu.txt
          free -m > reports/memory.txt
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Prepare loopback stack with explicit socket limits
        working-directory: upstream
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,pathlib
          p=pathlib.Path('docker-compose.yml')
          s=re.sub(r'(?m)^(\s*-\s*")(?=\$\{[A-Z_]+:-\d+\}:\d+")',r'\g<1>127.0.0.1:',p.read_text())
          s=s.replace('    container_name: juggleim-server','    ulimits:\n      nofile: 262144\n    container_name: juggleim-server')
          p.write_text(s)
          p=pathlib.Path('sql/imserver.sql')
          s=p.read_text(); bad='+CREATE TABLE IF NOT EXISTS `inboxmsgs_split`'
          assert s.count(bad)==1
          p.write_text(s.replace(bad,bad[1:]))
          PY
          git diff > ../reports/fixture.patch
          docker compose config --format json | jq -e 'all(.services[].ports[]?; .host_ip == "127.0.0.1")'
      - name: Run real authenticated connection diagnosis
        working-directory: upstream
        env:
          BENCH_CLIENTS: ${{ matrix.clients }}
          BENCH_RATE: '40'
          BENCH_WARMUP: '5s'
          BENCH_DURATION: '60s'
          BENCH_DELIVERY_GRACE: '10s'
          BENCH_OUTPUT_DIR: '../reports'
        run: |
          set -euo pipefail
          # Raise limits of this shell without relying on its inherited hard limit.
          sudo prlimit --pid $$ --nofile=262144:262144
          ulimit -n | tee ../reports/client-nofile.txt
          (while true; do
            date -u
            ss -s
            free -m
            docker stats --no-stream --format '{{json .}}' || true
            docker inspect --format '{{.Name}} {{json .State}} restart={{.RestartCount}}' juggleim-server juggleim-mysql 2>/dev/null || true
            sleep 5
          done) > ../reports/resource-samples.txt 2>&1 &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=30s 20m bash scripts/run-benchmark.sh private 2>&1 | tee ../reports/benchmark.log
          jq -e --argjson n "$BENCH_CLIENTS" '.connections.attempted==$n and .connections.succeeded==$n and .connections.failed==0 and .message_acknowledgements.succeeded>0 and .message_acknowledgements.failed==0 and .deliveries.succeeded>0 and .deliveries.failed==0' ../reports/*-private.json
      - name: Capture termination diagnostics before cleanup
        if: always()
        working-directory: upstream
        run: |
          mkdir -p ../reports
          docker inspect --format '{{.Name}} {{json .State}} restart={{.RestartCount}}' juggleim-server juggleim-mysql 2>&1 | tee ../reports/final-state.txt || true
          sudo dmesg | grep -Ei 'oom|out of memory|killed process' | tail -n 50 | tee ../reports/kernel-oom.txt || true
          docker compose logs --no-color --tail=200 > ../reports/service.log 2>&1 || true
          tail -n 40 ../reports/resource-samples.txt || true
          docker compose down -v --remove-orphans || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: juggle-diagnosis-${{ matrix.clients }}
          path: reports/
          retention-days: 30
