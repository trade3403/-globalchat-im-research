name: Phase 6G OpenIM authenticated 1000 connections
on:
  push:
    branches: [main]
    paths: ['.github/workflows/openim-protocol-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        clients: [1000]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned public source
        run: |
          set -euo pipefail
          mkdir -p reports
          git init -q upstream
          git -C upstream fetch -q --depth=1 https://github.com/openimsdk/open-im-server.git a101d85ec16cc21bec60005169725adc1ae5649a
          git -C upstream checkout -q --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = a101d85ec16cc21bec60005169725adc1ae5649a
          git -C upstream rev-parse HEAD > reports/source.txt
          lscpu > reports/cpu.txt
          free -m > reports/memory.txt
          sudo sysctl -w net.ipv4.ip_local_port_range="1024 65535"
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache: false
      - name: Build isolated source and gateway client
        working-directory: upstream
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,pathlib
          p=pathlib.Path('docker-compose.yml')
          s=re.sub(r'(?m)^(\s*-\s*")(?=(?:\d+|\$\{[A-Z_]+:-\d+\}):\d+")',r'\g<1>127.0.0.1:',p.read_text())
          p.write_text(s)
          p=pathlib.Path('internal/msggateway/ws_server.go')
          s=p.read_text()
          old='fmt.Sprintf(":%d", ws.port)'
          assert s.count(old)==1
          p.write_text(s.replace(old,'fmt.Sprintf("127.0.0.1:%d", ws.port)'))
          PY
          sed -i 's/^queue: kafka$/queue: redis/' config/share.yml
          sed -i 's/^listenIP: 0\.0\.0\.0$/listenIP: 127.0.0.1/' config/openim-msggateway.yml
          sed -i 's/listenIP: 0\.0\.0\.0/listenIP: 127.0.0.1/' config/openim-api.yml
          git diff > ../reports/fixture.patch
          docker compose config --format json | jq -e 'all(.services.mongodb.ports[], .services.redis.ports[], .services.minio.ports[]; .host_ip == "127.0.0.1")'
          go build -o "$RUNNER_TEMP/openim-capacity-server" ./cmd
          go build -o "$RUNNER_TEMP/openim-capacity-client" ../scripts/openim-connection-ladder.go
      - name: Run authenticated WebSocket push and recipient history reconciliation
        working-directory: upstream
        env:
          TARGET: '${{ matrix.clients }}'
        run: |
          set -euo pipefail
          sudo prlimit --pid $$ --nofile=262144:262144
          ulimit -n | tee ../reports/nofile.txt
          export REPORTS="$(realpath ../reports)"
          docker compose up -d mongodb redis minio
          "$RUNNER_TEMP/openim-capacity-server" -c "$PWD/config" > "$REPORTS/server.log" 2>&1 &
          server=$!
          (while true; do date -u; free -m; ss -s; ps -p "$server" -o pid,rss,pcpu,nlwp; docker stats --no-stream --format '{{json .}}' || true; sleep 5; done) > "$REPORTS/resources.txt" 2>&1 &
          monitor=$!
          trap 'kill "$monitor" "$server" 2>/dev/null || true' EXIT
          timeout --signal=TERM --kill-after=20s 25m "$RUNNER_TEMP/openim-capacity-client" | tee "$REPORTS/client.log"
          jq -e '.passed == true' "$REPORTS/result.json"
      - name: Capture diagnostics and cleanup
        if: always()
        working-directory: upstream
        run: |
          mkdir -p ../reports
          docker compose ps -a > ../reports/container-status.txt || true
          sudo dmesg | grep -Ei 'oom|out of memory|killed process' | tail -n 50 > ../reports/kernel-oom.txt || true
          docker compose logs --no-color --tail=100 > ../reports/dependencies.log 2>&1 || true
          docker compose down -v --remove-orphans || true
          if test -f ../reports/result.json; then cat ../reports/result.json; fi
          if test -f ../reports/history-reconciliation.json; then cat ../reports/history-reconciliation.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openim-preflight-${{ matrix.clients }}
          path: reports/
          retention-days: 30
